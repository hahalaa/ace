# Local full-stack run, offline: `docker compose up --build`, then open http://localhost:4173
# The first build trains the model and precomputes the Monte Carlo (a few minutes).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # Lower this for a fast build; it sizes the baked-in Monte Carlo.
        PRECOMPUTE_RUNS: ${PRECOMPUTE_RUNS:-5000}
    image: ace-api:local
    container_name: ace-api
    ports:
      # Must match the URL compiled into the frontend bundle (the fetch runs in the host browser).
      - "8000:8000"
    # No environment: or volumes: the image bakes in the CSVs, draws, model and cache.
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Build arg, not an `environment:` entry, and repointing needs a rebuild.
        # The value is the API address as the browser sees it, not the compose-network name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: ace-frontend:local
    container_name: ace-frontend
    ports:
      # 4173 maps to nginx :80 and is already in config.API_ALLOWED_ORIGINS.
      - "4173:80"
    depends_on:
      api:
        # The API needs ~2s of startup; without this the first fetch can fail.
        condition: service_healthy
    restart: unless-stopped
