# Scheduled data refresh + retrain + simulation precompute; sequencing and aborts live in scripts/update_and_cache.py.
# Opens a pull request rather than pushing to main, and never touches data/draws/ (entrants are hand-entered).
name: Refresh data + precompute simulations

on:
  # Late Monday UTC: the vendor republishes the season file roughly weekly, after a Monday-evening publish.
  schedule:
    - cron: '17 23 * * 1'

  # tournament_id and refresh_data are separate inputs so re-simulating one draw needs no re-download.
  workflow_dispatch:
    inputs:
      tournament_id:
        description: 'Draw to precompute (blank = every simulatable draw)'
        required: false
        default: ''
      refresh_data:
        description: 'Download fresh match data first'
        type: boolean
        required: false
        default: true
      force:
        description: 'Regenerate even if the refresh changed no data'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

# Serialise: two runs push the same branch and would race.
concurrency:
  group: refresh-and-simulate
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh, retrain, precompute
    runs-on: ubuntu-latest
    timeout-minutes: 60  # slack for a slow runner; the work is ~2 min
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: --force-with-lease needs the remote ref this checkout has.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # 3.11, matching ci.yml and the Dockerfile.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The one networked step. Inputs go through env:, never interpolated into the shell (injection sink).
      - name: Refresh data, retrain, precompute
        env:
          MPLBACKEND: Agg  # headless: training writes PNGs
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
          # Resolved here because the inputs context is empty on `schedule`: refresh on, force off.
          REFRESH: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_data }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          args=(--summary-json summary.json)
          [ "$REFRESH" = "true" ] || args+=(--no-refresh)
          [ "$FORCE" != "true" ] || args+=(--force)
          [ -z "$TOURNAMENT_ID" ] || args+=(--draw "$TOURNAMENT_ID")
          python scripts/update_and_cache.py "${args[@]}"

      # `regenerated` (did the orchestrator write a cache file) is the commit gate, not a git diff.
      - name: Read the run summary
        id: summary
        run: |
          set -euo pipefail
          cat summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s = json.load(open("summary.json"))
          print(f"regenerated={str(bool(s['succeeded'])).lower()}")
          print(f"data_changed={str(s['data_changed']).lower()}")
          print(f"caches={' '.join(s['succeeded'])}")
          print(f"years={' '.join(str(y) for y in s['changed_years'])}")
          print(f"estimator={s['estimator_class'] or 'unchanged'}")
          PY

      # Run here because ci.yml on a GITHUB_TOKEN-opened PR stays approval-required until a human clicks it.
      - name: Run the test suite against the refreshed data
        if: steps.summary.outputs.regenerated == 'true'
        run: pytest -q

      # `git add -f data/cache`: the single deliberate override of .gitignore's data/cache rule (without -f the add is a silent no-op).
      - name: Stage the changes
        id: stage
        if: steps.summary.outputs.regenerated == 'true'
        run: |
          set -euo pipefail
          git add data/raw
          git add -f data/cache
          if git diff --cached --quiet; then
            echo "nothing staged, no commit, no PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and open a pull request
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/data-refresh
          CACHES: ${{ steps.summary.outputs.caches }}
          YEARS: ${{ steps.summary.outputs.years }}
          ESTIMATOR: ${{ steps.summary.outputs.estimator }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m "data: refresh vendored match data + regenerate sim cache" \
                     -m "Seasons changed: ${YEARS:-none}. Caches: ${CACHES:-none}." \
                     -m "Automated by .github/workflows/refresh-and-simulate.yml (run ${GITHUB_RUN_ID})."
          # One long-lived force-pushed branch: at most one open data-refresh PR, always carrying the latest data.
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          cat > pr-body.md <<EOF
          Automated by \`.github/workflows/refresh-and-simulate.yml\`.

          - **Seasons whose vendored CSV changed:** ${YEARS:-none}
          - **Caches regenerated:** ${CACHES:-none}
          - **Estimator retrained to:** \`${ESTIMATOR}\`, best-of-four on \`TEST_YEAR\`, so the *type* can change with the data. The model itself is gitignored and is not in this diff; \`metadata.estimator_class\` in each cache file records it.
          - **Not touched:** \`data/draws/\`, entrants are entered by hand.

          The suite ran green against the refreshed data before this PR was opened.
          Review the title probabilities before merging: merging changes what the
          public demo shows.

          [Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH; the force-push above updated it."
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "data: weekly refresh + regenerated simulation cache" \
              --body-file pr-body.md
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Refresh + precompute"
            echo '```json'
            cat summary.json 2>/dev/null || echo '{"ok": false, "message": "the orchestrator produced no summary"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
