# Source-level checks (pytest + typecheck + build) on every push and pull request.
# No runtime artefacts and no network; the container build/smoke-test is a manual step.
name: CI

on:
  push:
  pull_request:

# Cancels only a run superseded by a newer push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 matches the Dockerfile base image.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  frontend-check:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 matches the Dockerfile builder stage.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, not bare `tsc --noEmit`: the build uses project references (`tsc -b`).
      - name: Type-check
        run: npm run typecheck

      # VITE_API_BASE_URL is deliberately left unset; the build warns-but-succeeds without one.
      - name: Build
        run: npm run build
