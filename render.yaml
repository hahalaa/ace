# Render Blueprint for the ace frontend (static site). Read from the repo root;
# `rootDir` moves the build into `frontend/` and every path below is relative to it.
#
# The portable contract for any static host:
#   build command   npm ci && npm run build
#   publish dir     frontend/dist
#   build env var   VITE_API_BASE_URL   (required, no default, inlined at BUILD time)
#
# After a real deploy: add the frontend origin to config.API_ALLOWED_ORIGINS and
# restart the API, and serve the API over HTTPS if the frontend is (browsers block
# https -> http and it surfaces as the generic "could not reach the ace API" panel).
#
# Frontend container packaging is separate and lives in the root Dockerfile /
# docker-compose.yml, not here.

services:
  - type: web
    name: play-ace
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Base URL of the deployed ace API. Read by Vite at build time and inlined
      # into the bundle, so a change needs a rebuild, not just a restart.
      # `sync: false`: Render prompts for the value and stores it on the service.
      # The repo hardcodes no origin, and the API CORS allow-list is explicit, so
      # both sides are configured together at deploy time.
      - key: VITE_API_BASE_URL
        sync: false

    headers:
      # Hashed asset filenames change whenever their bytes do: cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Un-hashed files that a deploy must be able to replace immediately.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /theme-init.js
        name: Cache-Control
        value: no-cache
      - path: /favicon.svg
        name: Cache-Control
        value: no-cache
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache
      - path: /apple-touch-icon.png
        name: Cache-Control
        value: no-cache

      # CSP scoped to what a Vite build of this app actually loads: same-origin
      # ES module bundle + stylesheet + the same-origin pre-paint /theme-init.js
      # (which must stay an external file, never an inline <script>, or CSP blocks
      # it; regression-guarded by test). connect-src is pinned to the exact
      # deployed API origin, not *.onrender.com (a shared host), and must match
      # the origin baked into the bundle via VITE_API_BASE_URL. No 'unsafe-inline'
      # or 'unsafe-eval' anywhere.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://ace-7acv.onrender.com;
          frame-ancestors 'none';
          base-uri 'none';
          form-action 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      # HSTS is omitted on purpose: Render terminates TLS and owns that header at
      # its edge (its dashboard offers it).

    # No SPA rewrite rule on purpose: every screen is `/` plus a query string, so
    # no deep link requests a non-index path, and a catch-all rewrite would only
    # turn genuine 404s into blank app shells. If a real router is adopted, add:
    #
    # routes:
    #   - type: rewrite
    #     source: /*
    #     destination: /index.html
