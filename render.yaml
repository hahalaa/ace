# Render Blueprint: static host for frontend/ (build `npm ci && npm run build`, publish frontend/dist).

services:
  - type: web
    name: play-ace
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Inlined into the bundle at build time; a change needs a rebuild, not a restart.
      - key: VITE_API_BASE_URL
        sync: false

    headers:
      # Hashed asset filenames change whenever their bytes do: cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Un-hashed files a deploy must be able to replace immediately.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /theme-init.js
        name: Cache-Control
        value: no-cache
      - path: /favicon.svg
        name: Cache-Control
        value: no-cache
      - path: /favicon.ico
        name: Cache-Control
        value: no-cache
      - path: /apple-touch-icon.png
        name: Cache-Control
        value: no-cache

      # connect-src must match the origin baked into the bundle via VITE_API_BASE_URL.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://ace-7acv.onrender.com;
          frame-ancestors 'none';
          base-uri 'none';
          form-action 'self'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      # HSTS is omitted: Render owns that header at its TLS edge.

    # No SPA rewrite rule: every screen is `/` plus a query string.
